version: "2"

linters:
  default: all
  enable:
    - gomodguard_v2
  disable:
    - cyclop
    - err113
    - exhaustruct
    - funcorder
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gomodguard
    - godoclint
    - godox
    - gomoddirectives
    - govet
    - ireturn
    - lll
    - mnd
    - nestif
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - staticcheck
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
    depguard:
      rules:
        framework_no_root_utilities:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/opendatahub-io/odh-platform-utilities/pkg/
              desc: use framework-local packages instead of root pkg/*
            - pkg: github.com/opendatahub-io/odh-platform-utilities/api/
              desc: use framework/api instead of root api/*
    importas:
      no-unaliased: true
    revive:
      rules:
        - name: unexported-return
          disabled: true

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
