name: Add LGTM After Review

on:
  workflow_run:
    workflows: [LGTM Review Trigger]
    types: [completed]

permissions: {}

jobs:
  add-lgtm-on-approval:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: headSha,
              per_page: 100,
            });
            const currentPullRequests = pullRequests.filter((pullRequest) =>
              pullRequest.state === 'open' && pullRequest.head.sha === headSha,
            );

            for (const pullRequest of currentPullRequests) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const latestReviewsByUser = new Map();

              for (const review of reviews) {
                const login = review.user?.login;
                if (!login || !review.submitted_at) {
                  continue;
                }

                const latestReview = latestReviewsByUser.get(login);
                if (!latestReview || review.submitted_at >= latestReview.submitted_at) {
                  latestReviewsByUser.set(login, review);
                }
              }

              const hasCurrentApproval = [...latestReviewsByUser.values()].some((review) =>
                review.state === 'APPROVED' && review.commit_id === pullRequest.head.sha,
              );
              if (!hasCurrentApproval) {
                core.info(`No current approval found for PR #${pullRequest.number}`);
                continue;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullRequest.number,
                labels: ['lgtm'],
              });
              core.info(`Added lgtm to PR #${pullRequest.number}`);
            }
