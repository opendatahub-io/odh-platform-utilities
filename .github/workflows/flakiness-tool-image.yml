name: Build and Push flakiness-tool Image

on:
  push:
    branches: [main]
    paths:
      - "flakiness/**"
    tags:
      - "flakiness-tool/v*"
  pull_request:
    branches: [main]
    paths:
      - "flakiness/**"

env:
  IMAGE_REGISTRY: quay.io
  IMAGE_REPO: opendatahub/flakiness-tool

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: meta
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GH_REF" == refs/tags/flakiness-tool/v* ]]; then
            VERSION="${GH_REF_NAME#flakiness-tool/}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE_REGISTRY}/${IMAGE_REPO}:${VERSION},${IMAGE_REGISTRY}/${IMAGE_REPO}:latest" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GH_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE_REGISTRY}/${IMAGE_REPO}:sha-${GH_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: flakiness
          file: flakiness/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: flakiness-tool ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ## Container Image

            ```
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ needs.build.outputs.version }}
            ```
